<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HoneyBiu · 500K 冲刺进度</title>
<style>
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#111111;color:#fff;display:flex;min-height:100vh;align-items:center;justify-content:center}
  .card{width:min(92vw,420px);padding:28px 24px;background:#1b1b1b;border-radius:20px;box-shadow:0 8px 32px rgba(0,0,0,.5)}
  .t{font-size:15px;color:#bbb;letter-spacing:.05em}
  .big{font-size:56px;font-weight:800;line-height:1.1;margin:8px 0 2px}
  .big small{font-size:22px;color:#888;font-weight:600}
  .pct{font-size:20px;color:#E30613;font-weight:700}
  .bar{height:10px;background:#333;border-radius:5px;margin:16px 0 20px;overflow:hidden}
  .bar i{display:block;height:100%;background:#E30613;border-radius:5px}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;text-align:center}
  .grid b{display:block;font-size:19px}
  .grid span{font-size:12px;color:#999}
  .foot{margin-top:18px;font-size:12px;color:#777;text-align:center}
</style>
</head>
<body>
<div class="card">
  <div class="t">@HoneyBiu · X 500K 曝光冲刺</div>
  <div class="big"><span id="cur">–</span><small> / <span id="goal">–</span>K</small></div>
  <div class="pct">已完成 <span id="pct">–</span>%</div>
  <div class="bar"><i id="bar" style="width:0%"></i></div>
  <div class="grid">
    <div><b id="rem">–</b><span>还差 (K)</span></div>
    <div><b id="left">–</b><span>剩余天数</span></div>
    <div><b id="need">–</b><span>日均需 (K)</span></div>
  </div>
  <div class="foot">窗口第 <span id="day">–</span> 天 · 数据更新于 <span id="upd">–</span></div>
</div>
<script>
fetch('ocr.json').then(r=>r.json()).then(d=>{
  cur.textContent=d.current_k; goal.textContent=d.goal_k; pct.textContent=d.percent;
  bar.style.width=d.percent+'%'; rem.textContent=d.remaining_k; left.textContent=d.days_left;
  need.textContent=d.daily_needed_k; day.textContent=d.day; upd.textContent=d.updated;
}).catch(()=>{});
</script>
</body>
</html>
